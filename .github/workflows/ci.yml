# CI for scankit (a driverless-first scanner stack in pure Rust).
#
# Layout under test:
#   - scankit-core             the shared vocabulary. Zero dependencies, gated.
#   - scankit-escl / -wsd      sans-I/O protocol cores: state machines over value types.
#   - scankit-http / -discover the two leaves allowed to touch a socket.
#   - scankit-backend-*        the pumps that own retries, timeouts, and polling,
#                              plus the scriptable virtual device.
#   - scankit                  the facade: re-exports, Composite, the one-call API.
#   - scankit-cli              the `skan` command. A bin never shares a lib's name.
#   - scankit-driverkit        the `scandev` bring-up tool, publish = false.
#   - scankit-testkit          dev-only harness, publish = false.
#   - xtask                    repository policy checks shared by Just and CI.
#
# Policy:
#   - Every third-party action is SHA-pinned (Dependabot bumps them weekly); the comment
#     records the human-readable version.
#   - Every job runs the same `just` recipe a developer runs locally, so CI and the dev
#     box cannot drift. `just ci` runs offline and predicts this pipeline exactly.
#   - `deps`, `purity`, `placeholder`, `unsafe-boundary`, and `bin-name` are required
#     gates, not advisory ones. They are what make the architecture in docs/adr/ true
#     rather than aspirational; hardware-verified interoperability jobs are deliberately
#     absent from the required set (docs/adr/0011).
#   - A single `ci-required` aggregation gate is the one status context branch protection
#     references, so the ruleset never desyncs as jobs are added or renamed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue lean.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # NOTE: `-D warnings` is applied per job, only on the stable toolchain we can reproduce
  # locally. It is deliberately not global: the msrv job installs an older toolchain whose
  # version-specific warnings would turn CI red for a reason invisible to every local gate.
  # That job still fails on real errors.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - run: just fmt-check

  toml:
    name: taplo (TOML formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0,taplo-cli@0.10.0
      - run: just toml-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: just lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Scanning happens from desktops on all three operating systems, and the virtual
      # device makes the whole suite hardware-free. All three are first-class here, not
      # a courtesy (docs/adr/0011).
      - run: just test-ci

  feature-matrix:
    name: feature matrix (cargo-hack, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0,cargo-hack@0.6.45
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: just feature-matrix

  deps:
    name: deps (the frozen crate graph)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The ALLOWED matrix in xtask/src/deps.rs is the intent; the manifests are the
      # implementation. This job is what keeps the two from drifting apart.
      - run: just deps

  purity:
    name: purity (no socket, clock, or third party in the sans-I/O crates)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # A protocol core that can be tested from a transcript is the whole verification
      # strategy (docs/adr/0003, docs/adr/0011). This is what makes it stay true.
      - run: just purity

  placeholder:
    name: placeholder (no unwritten body, no suppressed lint)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: just placeholder

  unsafe-boundary:
    name: unsafe-boundary (no unsafe outside the allowlist, which is empty)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: just unsafe-boundary

  bin-name:
    name: bin-name (no bin target shares a lib crate's name)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: just bin-name

  doc:
    name: doc (rustdoc, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - env:
          RUSTDOCFLAGS: -D warnings
        run: just doc

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  msrv:
    name: msrv (workspace 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-msrv@0.19.3,just@1.50.0
      # `cargo-msrv verify` reads each crate's declared `rust-version` and proves it builds
      # on that floor.
      - name: verify declared MSRVs
        run: just msrv

  reuse:
    name: reuse (SPDX/REUSE compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0
      # Run REUSE through `uvx` exactly as `just reuse` does locally rather than the
      # `fsfe/reuse-action` Docker action, whose anonymous Docker Hub pulls fail
      # intermittently for reasons unrelated to compliance.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
      - run: just reuse

  deny:
    name: dependency policy (cargo-deny + cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.3,just@1.50.0
      - run: just deny
      - run: just shear

  actionlint:
    name: actionlint + zizmor (workflow self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0,zizmor@1.28.0
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Official digest published on the v1.7.12 GitHub Release asset.
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |-
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --show-error --location --retry 5 --retry-connrefused \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (offline, high severity)
        run: just zizmor

  # Single aggregation gate. `if: always()` makes failures and cancellations visible
  # through the one branch-protection status.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - fmt
      - toml
      - clippy
      - test
      - feature-matrix
      - deps
      - purity
      - placeholder
      - unsafe-boundary
      - bin-name
      - doc
      - typos
      - msrv
      - reuse
      - deny
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: verify all required jobs passed (skipped counts as pass)
        run: |-
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed"

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
