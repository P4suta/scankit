# CI for scankit (a driverless-first scanner stack in pure Rust).
#
# Layout under test:
#   - scankit-core             the shared vocabulary. Zero dependencies, gated.
#   - scankit-escl / -wsd      sans-I/O protocol cores: state machines over value types.
#   - scankit-http / -discover the two leaves allowed to touch a socket.
#   - scankit-backend-*        the pumps that own retries, timeouts, and polling,
#                              plus the scriptable virtual device.
#   - scankit                  the facade: re-exports, Composite, the one-call API.
#   - scankit-cli              the `skan` command. A bin never shares a lib's name.
#   - scankit-driverkit        the `scandev` bring-up tool, publish = false.
#   - scankit-testkit          dev-only harness, publish = false.
#   - xtask                    repository policy checks shared by Just and CI.
#
# Policy:
#   - Every third-party action is SHA-pinned (Dependabot bumps them weekly); the comment
#     records the human-readable version.
#   - Every job runs the same `just` recipe a developer runs locally, so CI and the dev
#     box cannot drift. `just ci` runs offline and predicts this pipeline exactly.
#   - `deps`, `purity`, `placeholder`, `unsafe-boundary`, and `bin-name` are required
#     gates, not advisory ones. They are what make the architecture in docs/adr/ true
#     rather than aspirational; hardware-verified interoperability jobs are deliberately
#     absent from the required set (docs/adr/0011).
#   - `ci-required` aggregates every CI job.
#     The `required` status remains the branch-protection context.

name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue lean.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up stable Rust
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: >-
            just@1.50.0,taplo-cli@0.10.0,typos@1.48.0,nextest@0.9.140,
            cargo-hack@0.6.45,cargo-msrv@0.19.3,cargo-deny@0.20.2,
            cargo-shear@1.13.3,zizmor@1.28.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.32
      - name: install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Official digest published on the v1.7.12 GitHub Release asset.
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |-
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --show-error --location --retry 5 --retry-connrefused \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Keep the `just ci` inventory together while limiting warning flags to stable.
      - name: stable CI gates
        env:
          RUSTFLAGS: -D warnings
        run: >-
          just fmt-check toml-check typos lint feature-matrix test-ci doc
          deps purity placeholder unsafe-boundary bin-name deny shear reuse
          actionlint zizmor
      - name: verify declared MSRVs
        run: just msrv

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up stable Rust
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.50.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Scanning happens from desktops on all three operating systems, and the virtual
      # device makes the whole suite hardware-free. All three are first-class here, not
      # a courtesy (docs/adr/0011).
      - run: just test-ci

  ci-required:
    name: ci-required
    if: always()
    needs: [linux, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          jq -e 'keys == ["linux", "test"] and all(.[]; .result == "success")' <<< "${RESULTS}"

  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require the CI aggregate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          jq -e 'keys == ["ci-required"] and all(.[]; .result == "success")' <<< "${RESULTS}"
