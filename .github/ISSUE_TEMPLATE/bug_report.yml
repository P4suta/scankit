name: Bug report
description: A compile failure, a broken API, or a tool that does not do what it documents
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        For a scanner that cannot be discovered, refuses a job, or misbehaves against
        this stack, use **Scanner interoperability report** instead — that is a quirk
        report and it needs different information. For a panic, a hang, or an unbounded
        allocation triggered by network input, report it privately through
        [a security advisory](https://github.com/P4suta/scankit/security/advisories/new)
        rather than here.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest program or `just` command that shows it.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "scankit 0.1.0, rustc 1.85.0, x86_64-unknown-linux-gnu"
    validations:
      required: true
