# Dependabot version updates. Weekly PRs for the GitHub Actions the workflows use, and for
# Cargo crates once any exist. Every commit is prefixed `build(deps)` so the Conventional
# Commits gate accepts a Dependabot-authored commit. Patch and minor Cargo updates group
# together; unrelated majors land on their own so each breaking change is weighed
# separately.
#
# Note that the sans-I/O crates are designed to have almost no external dependencies
# (docs/adr/0003, enforced by `just purity`), so the Cargo entry exists to cover the
# transport and discovery leaves, the facade, and the CLI rather than the protocol cores.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns: ["*"]
