# Install tools with `mise install`. Rust configuration is in rust-toolchain.toml.
# Every version here is duplicated in .github/workflows/ci.yml and the two must match:
# a gate that passes locally and fails in CI is worse than no gate.

[tools]
rust = "stable"

lefthook = "2.2.2"
committed = "1.1.12"
just = "1.59.0"

typos = "1.52.2"
taplo = "0.10.0"
actionlint = "1.7.12"
zizmor = "1.32.0"

# REUSE runs through uvx.
uv = "0.13.9"

cargo-binstall = "1.27.0"

"cargo:cargo-msrv" = "0.19.6"
"cargo:cargo-deny" = "0.22.0"
"cargo:cargo-hack" = "0.6.46"
"cargo:cargo-nextest" = "0.9.152"
"cargo:cargo-shear" = "1.14.1"

[settings.cargo]
binstall = true

[tasks.hooks]
description = "Install the git hooks (see lefthook.yml)"
run = "lefthook install"
