# typos — strict spell check across the repo, run by the CI `typos` job (crate-ci/typos)
# and the pre-commit hook. Fix typos rather than suppress them.
#
# `locale = "en-us"` is not negotiable and there is no allowlist for spellings. Write US
# spellings everywhere; only a quoted specification title keeps its original spelling.
#
# `[default.extend-words]` is absent because nothing has needed it. An entry is legitimate
# only when it is a name a protocol chose, not a word this project misspelled.

[default]
locale = "en-us"
# Git commit identifiers, not words: docs/M0-ground-truth.md and ADR 0012 pin the
# upstream revisions they measured (for example a SHA whose hex digits happen to spell
# a flagged subtoken). Narrower than the CHANGELOG.md file exclusion below, and for the
# same machine-generated reason; this is not a spelling allowance.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[files]
extend-exclude = [
  "target/**",
  "**/*.lock",
  # Machine-generated by release-plz from commit subjects; short SHAs split into
  # subtokens and get flagged. The source is reviewed at commit time.
  "CHANGELOG.md",
]

# Recorded device traffic is bytes, not prose. Cassettes land with the testkit
# (docs/adr/0011); extend this glob when they do.
[type.cassette]
extend-glob = ["*.cassette"]
check-file = false

[type.toml]
extend-glob = ["*.toml"]

[type.rust]
extend-glob = ["*.rs"]
