# Supply-chain policy for `cargo deny check`.

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Applies only to workspace path dependencies.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
# ring 0.17 still targets windows-sys 0.52 while the maintained networking and native certificate crates target 0.61.
# Both are target bindings with no shared runtime state;
# neither side can be unified without replacing the TLS crypto provider.
skip = [{ name = "windows-sys", version = "0.52.0" }]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
